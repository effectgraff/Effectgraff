name: Build and deploy EffectGraff to Yandex Object Storage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_DEFAULT_REGION: ru-central1
      AWS_ENDPOINT_URL: https://storage.yandexcloud.net
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      YC_BUCKET: ${{ secrets.YC_BUCKET }}
      YC_WWW_BUCKET: www.effectgraff.ru
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm exec vite build

      - name: Download all media assets for Yandex mirror
        run: |
          mkdir -p dist/public/manus-storage
          {
            grep -oE '"/manus-storage/[^"]+\.(webp|png|wav)"' client/src/pages/Home.tsx | sed -E 's#^"/manus-storage/([^\"]+)"$#\1#'
            grep -oE '"(img_|wall-)[^"]+\.webp"' client/src/pages/Home.tsx | tr -d '"'
            grep -oE '[0-9]{1,2}: "[a-f0-9]+"' client/src/pages/Home.tsx | sed -E 's/([0-9]{1,2}): "([a-f0-9]+)"/page-\1_\2.webp/' | sed -E 's/page-([0-9])_/page-0\1_/'
          } | sort -u | while read -r file; do
            test -n "${file}" || continue
            echo "Downloading ${file}"
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 --max-time 180 "https://effectport-5rhal3bg.manus.space/manus-storage/${file}" \
              --output "dist/public/manus-storage/${file}"
          done
          test -f dist/public/manus-storage/eg-club-logo-1_42f150e4.png
          test -f dist/public/manus-storage/page-01_d1846c42.webp
          test -f dist/public/manus-storage/img_2012_afd076d4.webp

      - name: Install AWS CLI
        run: python3 -m pip install --user awscli

      - name: Verify Yandex deployment configuration
        run: test -n "${YC_BUCKET}" && test -n "${AWS_ACCESS_KEY_ID}" && test -n "${AWS_SECRET_ACCESS_KEY}"

      - name: Upload static files to primary bucket
        run: ~/.local/bin/aws s3 sync dist/public/ "s3://${YC_BUCKET}/" --endpoint-url "${AWS_ENDPOINT_URL}" --delete

      - name: Upload static files to www bucket
        run: ~/.local/bin/aws s3 sync dist/public/ "s3://${YC_WWW_BUCKET}/" --endpoint-url "${AWS_ENDPOINT_URL}" --delete
