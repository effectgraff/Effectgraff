<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>EffectGraff — страница не найдена</title>
  <style>
    :root { color-scheme: light; --paper:#f3efe7; --ink:#18151a; --lilac:#a15cb5; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--paper); color:var(--ink); font-family:Arial,sans-serif; }
    main { width:min(100%,620px); padding:clamp(28px,7vw,70px); border:1px solid var(--ink); box-shadow:10px 10px 0 var(--lilac); background:#faf8f3; }
    .mark { display:inline-block; padding:8px 10px; background:var(--lilac); color:#fff; font-weight:700; letter-spacing:.12em; }
    .code { margin:42px 0 12px; font-size:clamp(68px,15vw,128px); line-height:.8; letter-spacing:-.09em; }
    h1 { margin:0; font-size:clamp(24px,5vw,42px); }
    p { max-width:480px; margin:18px 0 28px; line-height:1.6; color:#635b62; }
    nav { display:flex; flex-wrap:wrap; gap:12px; }
    a { padding:12px 14px; background:var(--ink); color:#fff; text-decoration:none; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
    a.secondary { background:transparent; color:var(--ink); border:1px solid var(--ink); }
  </style>
</head>
<body>
  <main>
    <span class="mark">EFFECTGRAFF</span>
    <div class="code">404</div>
    <h1>Страница не найдена.</h1>
    <p>Похоже, адрес устарел или в него попал лишний символ. Откройте главную страницу или перейдите в рабочую CRM-панель.</p>
    <nav>
      <a href="https://www.effectgraff.ru/">На главную</a>
      <a class="secondary" href="https://effectport-5rhal3bg.manus.space/crm">Открыть CRM</a>
    </nav>
  </main>
</body>
</html>
